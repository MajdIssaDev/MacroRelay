name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter build
        run: |
          cd app
          flutter pub get
          flutter build windows --release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Pack installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $out = "app\build\windows\x64\runner\Release"
          vpk pack --packId MacroRelay --packVersion $ver --packDir $out --mainExe MacroRelay.exe --packTitle MacroRelay --icon "app\windows\runner\resources\app_icon.ico" --outputDir artifacts

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --outputDir artifacts --publish true --releaseName "MacroRelay ${{ github.ref_name }}" --tag "${{ github.ref_name }}"
