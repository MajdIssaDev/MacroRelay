name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish src/MacroRelay.App/MacroRelay.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -o publish

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Pack installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          vpk pack --packId MacroRelay --packVersion $ver --packDir publish --mainExe MacroRelay.exe --packTitle MacroRelay --outputDir artifacts

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --outputDir artifacts --publish true --releaseName "MacroRelay ${{ github.ref_name }}" --tag "${{ github.ref_name }}"
